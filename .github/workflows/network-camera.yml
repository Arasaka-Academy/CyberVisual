name: Camera protocol and dashboard tests

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/install_jetson.sh', 'deploy/systemd/**', '.github/workflows/network-camera.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/install_jetson.sh', 'deploy/systemd/**', '.github/workflows/network-camera.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build software H.264 test runtime
        run: docker build -t cybervisual-camera-test -f backend/tests/integration/Dockerfile .
      - name: Backend and independent ONVIF / FFmpeg interoperability
        run: docker run --rm -e RUN_CAMERA_INTEROP=1 -v "$PWD:/workspace" cybervisual-camera-test
      - name: Check deployment script syntax
        run: bash -n scripts/install_jetson.sh scripts/run_backend.sh

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - name: Verify browser behavior and all theme layouts
        run: npm run test:e2e
        env:
          CYBERVISUAL_CAPTURE_ONLY: '1'
      - name: Retain browser render and accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybervisual-console-browser
          path: frontend/artifacts/
          retention-days: 14
      - name: Verify committed device assets
        run: git diff --exit-code -- dist
